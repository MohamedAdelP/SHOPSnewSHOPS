<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل متاجر ومعارض مدينة كفر شكر</title>
    <!-- خطوط Cairo العصرية -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <!-- مكتبة قراءة ملفات الإكسيل -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        /* --- المتغيرات الأساسية للألوان والتصميم --- */
        :root {
            --primary: #0284c7; /* لون أزرق سماوي عصري للمحلات */
            --primary-hover: #0369a1;
            --bg-main: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius-card: 20px;
            --radius-btn: 50px;
            --shadow-card: 0 10px 15px -3px rgb(0 0 0 / 0.08), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }

        /* --- التصميم العام --- */
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            direction: rtl;
            box-sizing: border-box;
            line-height: 1.6;
        }

        /* --- الحاوية الرئيسية --- */
        .main-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* --- الهيدر الجديد (الشعار) --- */
        .brand-header {
            text-align: center;
            padding: 60px 20px;
            background: var(--card-bg);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-card);
            margin-bottom: 50px;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        /* خلفية زخرفية خفيفة في الهيدر */
        .brand-header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(2,132,199,0.05) 0%, rgba(255,255,255,0) 70%);
            pointer-events: none;
        }

        .brand-logo {
            font-size: 60px;
            margin-bottom: 15px;
            display: inline-block;
        }

        .brand-title {
            margin: 0;
            font-size: 36px;
            font-weight: 900;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        .brand-subtitle {
            margin: 10px 0 0;
            font-size: 16px;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* --- عنوان القسم --- */
        .section-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding-right: 10px;
        }

        .section-title::before {
            content: '';
            width: 6px;
            height: 30px;
            background-color: var(--primary);
            border-radius: 3px;
        }

        /* --- شبكة الكروت (Grid) --- */
        .shops-grid {
            display: grid;
            /* تحسين التجاوب: الكروت تأخذ الحجم المناسب تلقائياً */
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        /* --- الكارت (Card) الاحترافي --- */
        .shop-card {
            background: var(--card-bg);
            border-radius: var(--radius-card);
            padding: 30px;
            text-align: center;
            box-shadow: var(--shadow-card);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* أنيميشن مرن */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            text-decoration: none;
            position: relative;
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        /* تأثير الـ Hover على الكارت */
        .shop-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
            border-color: var(--primary);
        }

        /* تأثير إضافي عند الـ Hover */
        .shop-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, transparent, rgba(2,132,199,0.03));
            opacity: 0;
            transition: opacity 0.4s;
        }

        .shop-card:hover::after {
            opacity: 1;
        }

        /* --- أيقونة المتجر --- */
        .shop-icon-wrapper {
            font-size: 50px;
            margin-bottom: 20px;
            position: relative;
            display: inline-block;
            padding: 10px;
        }

        /* دائرة خلف الأيقونة */
        .shop-icon-wrapper::before {
            content: '';
            position: absolute;
            inset: 0;
            background-color: var(--bg-main);
            border-radius: 50%;
            transform: scale(0.8);
            transition: transform 0.3s;
        }

        .shop-card:hover .shop-icon-wrapper::before {
            transform: scale(1);
            background-color: #e0f2fe; /* لون أفتح عند الـ Hover */
        }

        .shop-icon {
            position: relative; /* لجعل الأيقونة فوق الدائرة */
            z-index: 1;
        }

        /* --- اسم المتجر --- */
        .shop-name {
            font-size: 20px;
            font-weight: 900;
            color: var(--text-main);
            margin-bottom: 10px;
            /* تفعيل السطور الجديدة */
            white-space: pre-line; 
            line-height: 1.4;
        }

        /* --- وصف المتجر --- */
        .shop-desc {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 25px;
            font-weight: 600;
            flex-grow: 1; /* يجعل الوصف يملأ الفراغ */
        }

        /* --- زرار الدخول --- */
        .shop-btn {
            background-color: var(--primary);
            color: white;
            padding: 14px 30px;
            border-radius: var(--radius-btn);
            font-weight: 700;
            font-size: 15px;
            transition: all 0.3s ease;
            display: inline-block;
            border: none;
            width: 100%; /* الزر يملأ عرض الكارت */
            box-sizing: border-box;
        }

        .shop-card:hover .shop-btn {
            background-color: var(--primary-hover);
            transform: scale(1.03); /* تكبير بسيط للزرار */
        }

        /* --- حالة التحميل والخطأ --- */
        .loading, .error-msg {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px;
            font-size: 18px;
            font-weight: 700;
            color: var(--text-muted);
            background: var(--card-bg);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-card);
            border: 1px solid var(--border-color);
        }

        .error-msg {
            color: #b91c1c;
        }

        /* --- تحسينات للموبايل (Responsive) --- */
        @media (max-width: 768px) {
            .main-wrapper {
                padding: 20px;
            }
            .brand-header {
                padding: 40px 20px;
                margin-bottom: 30px;
            }
            .brand-title {
                font-size: 28px;
            }
            .brand-logo {
                font-size: 50px;
            }
            .shops-grid {
                grid-template-columns: 1fr; /* كارت واحد في السطر على الموبايل */
            }
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <!-- الهيدر الجديد كلياً -->
        <header class="brand-header">
            <div class="brand-logo">🏙️</div>
            <h1 class="brand-title">دليل متاجر ومعارض كفر شكر</h1>
            <p class="brand-subtitle">منصة أهالي كفر شكر - تصفح أحدث المعروضات والمنتجات من مكانك</p>
        </header>

        <div class="section-title">🏪 المحلات والمطاعم المتاحة حالياً</div>
        
        <!-- منطقة عرض الكروت -->
        <div class="shops-grid" id="shops-grid">
            <div class="loading">جاري تحميل قائمة المعارض والمتاجر...</div>
        </div>
    </div>

    <script>
        // --- إعدادات الجافاسكريبت (بدون تغيير وظيفي) ---
        const excelFileName = 'bikes.xlsx'; 

        // خريطة الربط (تم إضافة \n للنزول لسطر جديد في الكود)
        const shopPagesMap = {
            "معرض عجل": "adel.html",
            "بيتزا هاوس": "pizza.html"
        };

        // أيقونات عصرية ومتنوعة
        const shopIcons = ["🚲", "🍕", "🍔", "📱", "👗", "🛠️", "🛒", "🔌", "🍜"];

        function loadShopsFromExcel() {
            fetch(excelFileName + '?t=' + new Date().getTime())
                .then(response => {
                    if (!response.ok) throw new Error("تعذر قراءة ملف الإكسيل");
                    return response.arrayBuffer();
                })
                .then(data => {
                    const workbook = XLSX.read(data, { type: 'array' });
                    const sheetNames = workbook.SheetNames; 
                    
                    const gridContainer = document.getElementById('shops-grid');
                    gridContainer.innerHTML = "";

                    if (sheetNames.length === 0) {
                        gridContainer.innerHTML = `<div class="loading">لا توجد معارض مسجلة في الملف.</div>`;
                        return;
                    }

                    // إنشاء الكروت
                    sheetNames.forEach((sheetName, index) => {
                        const targetPage = shopPagesMap[sheetName] || '#';
                        // استخدام الأيقونات بالترتيب، مع الدوران عند نفاذها
                        const icon = shopIcons[index % shopIcons.length];

                        const card = document.createElement('a');
                        card.className = 'shop-card';
                        card.href = targetPage;
                        
                        // التعامل مع المتاجر التي ليس لها صفحة بعد
                        if (targetPage === '#') {
                            card.onclick = (e) => {
                                e.preventDefault();
                                alert(`عفواً، صفحة المعرض "${sheetName.replace('\n', ' ')}" لم يتم إنشاؤها بعد.`);
                            };
                        }

                        // بناء الهيكل الجديد للكارت
                        card.innerHTML = `
                            <div>
                                <div class="shop-icon-wrapper">
                                    <span class="shop-icon">${icon}</span>
                                </div>
                                <div class="shop-name">${sheetName}</div>
                                <div class="shop-desc">اضغط لتصفح أحدث المنتجات والعروض الخاصة بمتجر ${sheetName.replace('\n', ' ')}</div>
                            </div>
                            <div>
                                <span class="shop-btn">دخول المتجر</span>
                            </div>
                        `;
                        gridContainer.appendChild(card);
                    });
                })
                .catch(error => {
                    console.error(error);
                    document.getElementById('shops-grid').innerHTML = `
                        <div class="error-msg">
                            ❌ خطأ في تحميل ملف الإكسيل (${excelFileName}).<br>
                            تأكد من وجود الملف في نفس المجلد ومن تشغيل Live Server.
                        </div>`;
                });
        }

        // بدء التحميل
        loadShopsFromExcel();
    </script>
</body>
</html>
