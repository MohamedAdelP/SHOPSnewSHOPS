<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقعنا قيد الصيانة</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 90%;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 26px;
        }
        p {
            color: #555;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .icon {
            font-size: 60px;
            color: #3498db;
            margin-bottom: 20px;
        }
        .footer {
            font-size: 14px;
            color: #95a5a6;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">🛠️</div>
        <h1>موقعنا قيد الصيانة حالياً</h1>
        <p>جاري الصيانة، وإن شاء الله يفتح قريب جداً لتقديم أفضل تجربة لكم. شكراً لصبركم وتفهمكم!</p>
        <div class="footer">فريق العمل &copy; 2026</div>
    </div>

</body>
</html>
